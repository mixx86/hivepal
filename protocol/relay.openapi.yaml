openapi: 3.1.0
info:
  title: hivepal relay API
  version: 1.0.0-draft
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    REST commands + event stream between the agent daemon, the Android app and
    the relay. See docs/protocol.md for flows.

    Conventions:
    - IDs are prefixed ULIDs (`dev_`, `call_`, `msg_`, `evt_`, `rly_`).
    - Timestamps are integer milliseconds since the Unix epoch (UTC).
    - Errors use the `Error` schema.
servers:
  - url: https://relay.example.com
tags:
  - name: pairing
  - name: devices
  - name: calls
  - name: messages
  - name: events
  - name: system
  - name: hivepal

paths:
  /pair:
    get:
      tags: [system]
      operationId: pairPage
      summary: >-
        Hivepal: the page a pairing link (`PairingToken.qr_url`) opens on a phone without the app or from
        its camera. Static HTML: it reads the code from the URL fragment in the browser and offers to
        install the app and to open it (`hivepal://pair?c=<code>`), plus the code to paste.
      security: []
      responses:
        "200":
          description: The page.
          content:
            text/html:
              schema: { type: string }

  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Relay is up.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }

  /v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Relay status, agent presence and active call.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Relay and peer status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/pairing-tokens:
    post:
      tags: [pairing]
      operationId: createPairingToken
      summary: Create a single-use pairing token (agent only).
      description: |
        Needs the API key: a short-lived agent token (`at_…`, hub mode) gets `403`, so it
        can't leave behind a credential that outlives it. Rotating the key deletes the
        tenant's unused pairing tokens.
      security: [{ agentKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl_s:
                  type: integer
                  minimum: 30
                  maximum: 600
                  default: 600
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairingToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Redeem a pairing token and register a device.
      description: |
        Unauthenticated; the pairing token is the credential. The token is
        consumed on success. Invalid, expired and already-used tokens all
        return 401 `invalid_pairing_token`. Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "201":
          description: Device registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/device/fcm:
    post:
      tags: [devices]
      operationId: updateFcmToken
      summary: Update the calling device's FCM registration token.
      security: [{ deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fcm_token]
              properties:
                fcm_token: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "204": { description: Updated. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/device/unifiedpush:
    post:
      tags: [devices]
      operationId: setUnifiedPushEndpoint
      summary: >-
        Hivepal: wake this device through UnifiedPush instead of FCM. While an endpoint is set, the relay
        POSTs each push to it: the body is the same `PushData` map as FCM's `data`, as JSON (signed the
        same way), with the `TTL` and `Urgency` (`high` / `normal`) headers. With `p256dh` and `auth`
        (the app's Web Push keys) the body is encrypted for the app (RFC 8291, `aes128gcm`), so the
        distributor's server can't read it; without them it's sent as plain JSON. A 404 or 410 answer
        forgets the endpoint. Only `https://` endpoints on a public host are accepted.
      security: [{ deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048 }
                p256dh:
                  description: The app's P-256 public key, uncompressed, base64url (Web Push `p256dh`).
                  type: string
                  pattern: "^[A-Za-z0-9_-]{86,88}={0,2}$"
                auth:
                  description: The app's 16-byte authentication secret, base64url (Web Push `auth`).
                  type: string
                  pattern: "^[A-Za-z0-9_-]{22,24}={0,2}$"
      responses:
        "204": { description: Set. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [devices]
      operationId: clearUnifiedPushEndpoint
      summary: "Hivepal: back to FCM for this device (if it has a token)."
      security: [{ deviceJwt: [] }]
      responses:
        "204": { description: Cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List paired devices (agent only).
      security: [{ agentKey: [] }]
      parameters:
        - name: include_revoked
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Paired devices.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device. Its JWT stops working immediately.
      description: |
        Needs the API key, not a short-lived agent token. If the phone is on the open
        call, the call ends and its room closes; if it is only ringing there, it stops
        counting, and a call left with no phone is `canceled`.
      security: [{ agentKey: [] }]
      responses:
        "204": { description: Revoked (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/calls:
    post:
      tags: [calls]
      operationId: createCall
      summary: Start a call. Agent → rings the user's devices; device → calls the agent.
      description: |
        The caller receives its LiveKit join info immediately. The callee
        receives a `call.invite` event and gets its join info from
        `POST /v1/calls/{call_id}/accept`.

        Targeted calls: the agent may pass `device_ids` to ring only those phones.
        The call is then private to them: the other phones get none of its events
        (WebSocket, push or `GET /v1/events`), do not see it in `GET /v1/calls`,
        `GET /v1/calls/{call_id}` and `POST /v1/calls/{call_id}/end` (404) or
        `active_call` in `GET /v1/status`, and cannot accept, decline or join it (403).

        On a plan with a call-time limit (hub mode), `429 rate_limited` after 20
        unanswered calls in an hour. A self-hosted relay has no such limit.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCallRequest" }
      responses:
        "201":
          description: Call created, state `ringing`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallWithJoin" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400":
          description: "`invalid_request`, e.g. a missing `reason` (agent caller), an empty `device_ids`, an unknown or revoked device id, or `device_ids` sent by a device."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`busy` (another call is ringing/active) or `no_devices` (agent caller, nothing paired)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`agent_offline` (device caller, no daemon connected) or `calls_unavailable` (LiveKit is not configured on this relay)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [calls]
      operationId: listCalls
      summary: Call history, newest first.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: Cursor; return calls with `call_id` lower than this.
          schema: { $ref: "#/components/schemas/CallId" }
      responses:
        "200":
          description: Calls.
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: array
                    items: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/calls/test:
    post:
      tags: [calls]
      operationId: testCall
      summary: >-
        Hivepal, device only: ring this phone after `delay_s` seconds, as a call from the main agent
        (the switchboard), so the user can lock it first and see it ring like a real call. Nobody else
        joins: hang up when done. The usual rules apply when it starts (one call at a time, limits).
      security: [{ deviceJwt: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delay_s: { type: integer, minimum: 0, maximum: 60, default: 10 }
      responses:
        "202":
          description: It will ring at `at`.
          content:
            application/json:
              schema:
                type: object
                required: [at]
                properties:
                  at: { $ref: "#/components/schemas/Timestamp" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Another call is ringing or active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Calls are not configured on this relay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/calls/{call_id}:
    parameters:
      - $ref: "#/components/parameters/CallId"
    get:
      tags: [calls]
      operationId: getCall
      summary: Get one call.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/calls/{call_id}/ringing:
    parameters:
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: reportRinging
      summary: Device reports it is showing the incoming call UI.
      security: [{ deviceJwt: [] }]
      responses:
        "204": { description: Recorded (idempotent; ignored if no longer ringing). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/calls/{call_id}/accept:
    parameters:
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: acceptCall
      summary: Callee accepts. For agent calls, any paired phone may answer while the call rings.
      description: |
        Group calls: every paired phone rings and each may answer until `expires_at`;
        all of them join the same LiveKit room. The first answer moves the call to
        `active`. A phone that already joined may accept again while the call is
        active (rejoin after a drop, new token). Otherwise `409 invalid_state`; a
        phone that missed its ring window, declined or left uses
        `POST /v1/calls/{call_id}/join` instead.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Accepted; state `active`. Contains the callee's join info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallWithJoin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /v1/calls/{call_id}/join:
    parameters:
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: joinCall
      summary: A paired phone joins an agent call at any time while it is ringing or active.
      description: |
        "Join the call": unlike `accept`, this works for any paired phone that is not
        on the call, also after its ring window (`expires_at`), after declining, or
        after hanging up, as long as the call is `ringing` or `active`. While the call
        still rings it is the same as accepting (the call becomes `active`). Emits
        `call.accept` with this phone's `device_id` (once per phone that joins); a
        phone already on the call just gets a new token (no event). Only agent calls
        (`agent_to_user`) can be joined, and a targeted call (`device_ids`) only by
        the phones it targets.
      security: [{ deviceJwt: [] }]
      responses:
        "200":
          description: Joined; state `active`. Contains this phone's join info.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallWithJoin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (not an agent call, or a targeted call this phone is not in)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`call_ended` (the call is `ended`, `missed`, `declined` or `canceled`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`calls_unavailable` (LiveKit is not configured on this relay)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/calls/{call_id}/decline:
    parameters:
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: declineCall
      summary: Callee declines a ringing call.
      description: |
        A phone declining only stops its own ringing (event `call.decline` with its
        `device_id`); the call becomes `declined` when no phone is left ringing or on
        the call.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Declined; state `declined`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidState" }

  /v1/calls/{call_id}/end:
    parameters:
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: endCall
      summary: Hang up. While ringing, only the caller may call this (→ `canceled`).
      description: |
        On an active agent call a phone only leaves; the call ends (`ended`) when the
        agent hangs up or the last phone leaves (after the ring window, or once no
        other phone is still ringing). A call to the agent belongs to the phone that
        placed it: any other phone gets `403`. A targeted call doesn't exist for phones
        outside it: `404`, in every state.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: State `ended` or `canceled`. Idempotent on terminal states.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/livekit/webhook:
    post:
      tags: [calls]
      operationId: livekitWebhook
      summary: LiveKit server webhook (room/participant events).
      description: |
        Called by the LiveKit server, not by clients. Authenticated with the
        LiveKit webhook signature (a JWT signed with the LiveKit API secret that
        carries the SHA-256 of the body). `room_finished`, or either party
        leaving the room, ends an `active` call with `by: relay, reason: room_closed`.
      security: [{ livekitWebhook: [] }]
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema: { type: object }
      responses:
        "200": { description: Processed (also for events that don't concern a call). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/messages:
    post:
      tags: [messages]
      operationId: postMessage
      summary: Send a message. `from` is derived from the credential.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostMessageRequest" }
      responses:
        "201":
          description: Created (or the existing message for a repeated `client_msg_id`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [messages]
      operationId: listMessages
      summary: Message history, oldest first.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      parameters:
        - name: after
          in: query
          description: Cursor; return messages with `msg_id` greater than this.
          schema: { $ref: "#/components/schemas/MsgId" }
        - name: since
          in: query
          description: Return messages created at or after this time (ms).
          schema: { $ref: "#/components/schemas/Timestamp" }
        - name: from
          in: query
          schema: { $ref: "#/components/schemas/Party" }
        - name: conv
          in: query
          description: Only this conversation. An agent always gets only its own conversations.
          schema: { $ref: "#/components/schemas/ConvId" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  has_more: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/messages/{msg_id}:
    parameters:
      - $ref: "#/components/parameters/MsgId"
    get:
      tags: [messages]
      operationId: getMessage
      summary: Get one message (e.g. after a truncated push).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/messages/{msg_id}/delete:
    parameters:
      - $ref: "#/components/parameters/MsgId"
    post:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete one of your own messages (Hivepal). Emits `msg.deleted`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/messages/{msg_id}/read:
    parameters:
      - $ref: "#/components/parameters/MsgId"
    post:
      tags: [messages]
      operationId: markMessageRead
      summary: Mark a message from the other party as read (emits `msg.read` once).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: Marked (idempotent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/typing:
    post:
      tags: [messages]
      operationId: setTyping
      summary: >-
        Hivepal: the agent is writing (`typing: true`, the default) or stopped, in a conversation it takes part
        in (default: its own). The phones show "typing…" and a "…" bubble. It lasts 20 s unless repeated, and
        ends when the agent sends a message there. The relay also sets it by itself for 60 s when an agent marks
        a recent message from the user as read. Live only: an ephemeral `agent.typing` event, never stored or pushed.
      security: [{ agentKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                conv: { $ref: "#/components/schemas/ConvId" }
                typing: { type: boolean, default: true }
      responses:
        "204": { description: Done. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/agents:
    get:
      tags: [agents]
      operationId: listAgents
      summary: The agents that write to this relay (multi-agent fork). `main` is the relay API key's agent.
      description: |
        Each agent has its own `ak_…` key and its own conversation with the user (`conv: agent:<agent_id>`).
        `main` always exists and uses the relay's API key. `online` is true while the agent holds a WebSocket.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Agents, `main` first.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [agents]
      operationId: createAgent
      summary: Add an agent with its own API key. Relay API key (`main`) only. The key is returned once.
      security: [{ agentKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentRequest" }
      responses:
        "201":
          description: Created. Emits `agent.updated`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAgent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`exists`: an agent with this id already exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agent_id}:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    patch:
      tags: [agents]
      operationId: updateAgent
      summary: "Rename an agent (the user from the app, or the relay API key). Emits `agent.updated`."
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [agents]
      operationId: removeAgent
      summary: Revoke an agent's key and remove it from groups. Relay API key only; `main` can't be removed.
      security: [{ agentKey: [] }]
      responses:
        "204": { description: Removed. Emits `agent.updated` with `removed`. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{agent_id}/wake:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    put:
      tags: [agents]
      operationId: setAgentWake
      summary: >-
        Hivepal: the address the relay emails when the user writes to this agent (directly or in a group), so an
        agent that only runs on a trigger wakes up. One email a minute at most; it never carries the message.
        `email: null` turns it off. The relay API key or a phone; needs the relay's email account (`PUT /v1/settings/email`).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: [string, "null"], maxLength: 254 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{agent_id}/wake/test:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    post:
      tags: [agents]
      operationId: testAgentWake
      summary: >-
        Hivepal: send the agent's wake-up email now, as if the user had written to it (the same subject, so
        the agent's routine runs too), and wait for the mail server's answer. The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: The mail server accepted it. }
        "400":
          description: "`invalid_request`: this relay has no email account or the agent has no address."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: "`email_failed`: the mail server refused it or couldn't be reached; the message says why."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agent_id}/mailbox:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    put:
      tags: [agents]
      operationId: setAgentMailbox
      summary: >-
        Hivepal: whether the relay writes this agent's messages as Markdown files (issue #41): `inbox/`, one
        file per message it receives, and, with Markdown memory on (`PUT /v1/settings/memory`),
        `history/<conversation>/<YYYY-MM-DD>.md`, each day's conversation with both sides. Into its own
        repository in the relay (`…/mailbox.git`) and, when set, the external one (`mailbox/<agent>/…`).
        Turning it on writes the last 90 days of history. When the agent also has a wake-up email, it goes
        out after the files are written. `enabled: null` follows the relay-wide default
        (`PUT /v1/settings/mailboxes`). The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: [boolean, "null"] }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{agent_id}/mailbox.git/{path}:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
      - name: path
        in: path
        required: true
        description: What git's dumb HTTP protocol reads (`info/refs`, `HEAD`, `objects/…`).
        schema: { type: string }
    get:
      tags: [agents]
      operationId: getAgentMailboxGit
      summary: >-
        Hivepal: the agent's mailbox repository, read-only, for `git clone https://x:<key>@relay/v1/agents/<id>/mailbox.git`.
        Without credentials it answers 401 with `WWW-Authenticate: Basic`; the password (or a Bearer token)
        is the agent's own key, the relay API key or a phone's token.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{agent_id}/memory:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    get:
      tags: [agents]
      operationId: searchAgentMemory
      summary: >-
        Hivepal: the agent's memory as SQLite (on with `PUT /v1/settings/memory {sqlite: true}`, else 404):
        its messages, newest first, full-text matching `q` (words, all of them), in `conv`, before `before`.
        Only the conversations it takes part in. The agent's own key, the relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500 } }
        - { name: conv, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Matching messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      required: [msg_id, conv, from, from_name, text, created_at]
                      properties:
                        msg_id: { type: string }
                        conv: { type: string }
                        from: { type: string, description: "`user` or an agent id" }
                        from_name: { type: string }
                        text: { type: string }
                        reply_to: { type: string }
                        created_at: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{agent_id}/memory.sqlite:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    get:
      tags: [agents]
      operationId: getAgentMemoryFile
      summary: >-
        Hivepal: the agent's conversations as a SQLite file of its own (`messages` with a `messages_fts`
        full-text index, and `about`), for an agent that queries its memory itself. Same rules as
        `GET /v1/agents/{agent_id}/memory`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: The database.
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/settings/mailboxes:
    put:
      tags: [system]
      operationId: setMailboxesForAll
      summary: >-
        Hivepal: every agent gets a mailbox unless it's turned off for it (`PUT /v1/agents/{agent_id}/mailbox`).
        The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [all_agents]
              properties:
                all_agents: { type: boolean }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/settings/memory:
    put:
      tags: [system]
      operationId: setMemory
      summary: >-
        Hivepal: how bots remember their Hivepal conversations. `markdown`: each day's conversation in their
        mailbox (`history/`). `sqlite`: they search it or download it as SQLite
        (`GET /v1/agents/{agent_id}/memory`). Neither: each run starts from the bot's own instructions only.
        The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Memory" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/settings/delivery:
    get:
      tags: [system]
      operationId: getDeliverySettings
      summary: >-
        Hivepal: how the relay reaches agents: its email account for wake-up emails (never the password) and
        the external mailbox repository with the relay's SSH deploy key (add it to the repository with write
        access) and the last push. The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/settings/email:
    put:
      tags: [system]
      operationId: setDeliveryEmail
      summary: >-
        Hivepal: the email account wake-up emails are sent from. The relay logs in before saving it, so a
        wrong password fails here (`502 email_failed`). `server` (`host:port`; 465 = TLS, 587 = STARTTLS) is
        guessed for Gmail, iCloud, Yahoo, Fastmail, GMX and Zoho. `address: null` turns email off. Saved in the
        relay, it replaces `HIVEPAL_SMTP_URL`. The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address: { type: [string, "null"], maxLength: 254 }
                password: { type: string, maxLength: 512 }
                server: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`email_failed`: the mail server refused the login or couldn't be reached; the message says why."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/settings/mailbox-repo:
    put:
      tags: [system]
      operationId: setMailboxRepo
      summary: >-
        Hivepal: an external git repository the relay writes agents' mailboxes to (`mailbox/<agent>/…`) and
        pushes, with its SSH deploy key (`DeliverySettings.mailbox_repo.public_key`), or https:// with a token
        in the URL. `url: null` stops it (the mailboxes in the relay stay). The relay API key or a phone.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: { type: [string, "null"], maxLength: 512, examples: ["git@github.com:me/notes.git"] }
                branch: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliverySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/settings/mailbox-repo/test:
    post:
      tags: [system]
      operationId: testMailboxRepo
      summary: "Hivepal: clone the external repository again and check the relay may push to it. The relay API key or a phone."
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: It works. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`repo_failed`: git couldn't clone or push; the message says why (often: the deploy key isn't added, or has no write access)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agent_id}/key:
    parameters:
      - name: agent_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    post:
      tags: [agents]
      operationId: rotateAgentKey
      summary: Give an agent a new API key (the old one stops working). Relay API key only; not for `main`.
      security: [{ agentKey: [] }]
      responses:
        "200":
          description: The new key, returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAgent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/groups:
    get:
      tags: [agents]
      operationId: listGroups
      summary: Group conversations. An agent sees only the groups it belongs to.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [agents]
      operationId: createGroup
      summary: "Create a group conversation (`conv` = `group:<group_id>`). The user or the relay API key."
      description: Every member reads what the user and the other members write in it. Emits `group.updated`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`exists`: a group with this id already exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/groups/{group_id}:
    parameters:
      - name: group_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    patch:
      tags: [agents]
      operationId: updateGroup
      summary: Rename a group or change its members. The user or the relay API key. Emits `group.updated`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [agents]
      operationId: removeGroup
      summary: Delete a group (its messages stay in the log). Emits `group.updated` with `removed`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/files:
    post:
      tags: [messages]
      operationId: uploadFile
      summary: Upload a photo or audio clip to attach to a message (raw body, at most 10 MB).
      description: |
        The body is the file itself, with its media type as `Content-Type` (image/jpeg, image/png,
        image/webp, audio/mp4, audio/aac, audio/ogg, audio/mpeg, audio/webm). Attach it with
        `attachments` in `POST /v1/messages`.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          "image/*": { schema: { type: string, format: binary } }
          "audio/*": { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, pattern: "^file_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [messages]
      operationId: getFile
      summary: Download a file. An agent may get the files it uploaded or that are attached to a message it can see.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: The file, with its media type.
          content:
            "image/*": { schema: { type: string, format: binary } }
            "audio/*": { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/files/{file_id}/transcript:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, pattern: "^file_[0-9A-HJKMNP-TV-Z]{26}$" }
    get:
      tags: [messages]
      operationId: getTranscript
      summary: A voice note as text (Gemini, made on first request and kept). Same access as the file.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: The transcript.
          content:
            application/json:
              schema: { type: object, required: [text], properties: { text: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: "`calls_unavailable`: no GEMINI_API_KEY on this relay."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tts:
    post:
      tags: [messages]
      operationId: textToSpeech
      summary: Turn text into a voice note (audio/wav, Gemini TTS) to attach to a message.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
                voice: { type: string, maxLength: 40, description: "A Gemini prebuilt voice (default Kore)." }
      responses:
        "201":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "503":
          description: "`calls_unavailable`: no GEMINI_API_KEY on this relay."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/reminders:
    post:
      tags: [messages]
      operationId: createReminder
      summary: Schedule a message. At `at` the relay posts it as the agent (push included), even if the agent is not running then.
      security: [{ agentKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReminderRequest" }
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reminder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [messages]
      operationId: listReminders
      summary: Pending reminders (an agent sees its own; the user sees all).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Pending reminders, soonest first.
          content:
            application/json:
              schema:
                type: object
                required: [reminders]
                properties:
                  reminders:
                    type: array
                    items: { $ref: "#/components/schemas/Reminder" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/subscriptions:
    get:
      tags: [hivepal]
      operationId: listSubscriptions
      summary: >-
        Hivepal: the user's subscriptions (Claude, Grok, the server…) and when each renews or ends, as last
        read from each service's own billing page by the user's phone. For the phone and the relay API key.
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "200":
          description: Soonest first; those without a date last.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/subscriptions/{sub_id}:
    parameters:
      - name: sub_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/AgentId" }
    put:
      tags: [hivepal]
      operationId: putSubscription
      summary: "Hivepal: record what the phone read from a service's billing page (the user's phone or the relay API key)."
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutSubscriptionRequest" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [hivepal]
      operationId: deleteSubscription
      summary: "Hivepal: forget a subscription (the user's phone or the relay API key)."
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reminders/{rem_id}:
    parameters:
      - name: rem_id
        in: path
        required: true
        schema: { type: string, pattern: "^rem_[0-9A-HJKMNP-TV-Z]{26}$" }
    delete:
      tags: [messages]
      operationId: cancelReminder
      summary: Cancel a pending reminder (its agent, or the user).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      responses:
        "204": { description: Canceled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Catch up on persisted events (same content as the WS replay).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/AfterSeq"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events ordered by `seq`.
          content:
            application/json:
              schema:
                type: object
                required: [events, last_seq, has_more]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  last_seq:
                    description: Highest seq in the relay log (not just in this page).
                    type: integer
                    minimum: 0
                  has_more: { type: boolean }
                  next_after_seq:
                    description: |
                      Pass as `after_seq` for the next page. It can be past the last
                      returned event when events this caller may not see (another
                      phone's targeted call) were left out of the page.
                    type: integer
                    minimum: 0
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/ws:
    get:
      tags: [events]
      operationId: eventStream
      summary: WebSocket event stream.
      description: |
        Upgrade to WebSocket. The server sends one JSON `Event` per text frame:
        first `ws.hello`, then every persisted event with `seq > after_seq`,
        then live events. Clients send nothing (ping/pong keepalive every 20 s; the
        pong must echo the ping's payload, as WebSocket libraries do). Replay is paced
        by the client: one that stops reading is dropped and resumes with `after_seq`.
        Close codes: 4401 unauthorized/revoked or expired agent token, 4409 replaced by
        a newer agent connection (only one daemon socket at a time), 1013 too many
        sockets (a phone keeps its 4 newest; a relay or tenant holds 64).
      security: [{ agentKey: [] }, { deviceJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/AfterSeq"
      responses:
        "101":
          description: Switching protocols. Frames follow `#/components/schemas/Event`.
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      bearerFormat: "ak_<base64url>"
      description: >-
        Daemon API key (HIVEPAL_API_KEY). In hub mode, a short-lived agent token
        (`at_<base64url>`, from the hub admin API) is accepted in its place.
    deviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: device_jwt obtained from POST /v1/pair.
    livekitWebhook:
      type: apiKey
      in: header
      name: Authorization
      description: LiveKit webhook signature (JWT signed with the LiveKit API secret).

  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DeviceId" }
    CallId:
      name: call_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CallId" }
    MsgId:
      name: msg_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/MsgId" }
    AfterSeq:
      name: after_seq
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    BadRequest:
      description: "`invalid_request`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthorized` or `invalid_pairing_token`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden` (e.g. the caller tries to accept its own call)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidState:
      description: "`invalid_state` (e.g. call already accepted elsewhere, missed or ended)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: "`rate_limited`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaExceeded:
      description: >-
        `quota_exceeded`: only on a hosted relay (hub mode, docs/cloud.md), when the
        tenant's plan limit for devices, call minutes or messages is reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------- primitives ----------
    Timestamp:
      description: Milliseconds since the Unix epoch (UTC).
      type: integer
      minimum: 0
    RelayId:
      type: string
      pattern: "^rly_[0-9A-HJKMNP-TV-Z]{26}$"
    DeviceId:
      type: string
      pattern: "^dev_[0-9A-HJKMNP-TV-Z]{26}$"
    CallId:
      type: string
      pattern: "^call_[0-9A-HJKMNP-TV-Z]{26}$"
    MsgId:
      type: string
      pattern: "^msg_[0-9A-HJKMNP-TV-Z]{26}$"
    EventId:
      type: string
      pattern: "^evt_[0-9A-HJKMNP-TV-Z]{26}$"
    AgentId:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]{0,31}$"
      examples: [main, nubi]
    ConvId:
      description: |
        A conversation: `agent:<agent_id>` (the user and one agent), `group:<group_id>` (the user
        and several agents, who all read it) or `bots:<a>.<b>` (two agents, ids sorted; the user can
        read it but its messages don't wake the phone). Messages from before the multi-agent fork
        belong to `agent:main`.
      type: string
      pattern: "^((agent|group):[a-z0-9][a-z0-9_-]{0,31}|bots:[a-z0-9][a-z0-9_-]{0,31}\\.[a-z0-9][a-z0-9_-]{0,31})$"
      examples: ["agent:main", "group:todos"]
    Attachment:
      type: object
      required: [file_id, mime, size]
      properties:
        file_id: { type: string }
        mime: { type: string, examples: [image/jpeg, audio/mp4] }
        size: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0, description: "Audio only, if the sender said." }
    Subscription:
      type: object
      required: [sub_id, name, status, checked_at]
      properties:
        sub_id: { $ref: "#/components/schemas/AgentId" }
        name: { type: string, description: "Claude, Grok, Webdock…" }
        plan: { type: string, description: "Pro, SuperGrok, the server's profile…" }
        status:
          type: string
          enum: [active, ending, ended, unknown, error]
          description: "`ending`: active until `until` and won't renew; `error`: the last read failed (see `error`)."
        until:
          description: When it renews (or ends, if `status` is `ending`).
          $ref: "#/components/schemas/Timestamp"
        price: { type: string, description: "As the service shows it, e.g. 21,78 € / month." }
        url: { type: string, description: The billing page it was read from. }
        error: { type: string }
        checked_at:
          description: When the scraper last read it successfully (or tried, for `error`).
          $ref: "#/components/schemas/Timestamp"
    PutSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        plan: { type: string, maxLength: 64 }
        status: { type: string, enum: [active, ending, ended, unknown, error] }
        until: { $ref: "#/components/schemas/Timestamp" }
        price: { type: string, maxLength: 64 }
        url: { type: string, maxLength: 512 }
        error: { type: string, maxLength: 500 }
    Reminder:
      type: object
      required: [rem_id, agent_id, conv, text, at, created_at]
      properties:
        rem_id: { type: string }
        agent_id: { $ref: "#/components/schemas/AgentId" }
        conv: { $ref: "#/components/schemas/ConvId" }
        text: { type: string }
        options:
          type: array
          items: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CreateReminderRequest:
      type: object
      additionalProperties: false
      required: [text, at]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        at:
          description: When to send it (ms since epoch); at most a year ahead.
          $ref: "#/components/schemas/Timestamp"
        conv:
          description: Default the agent's own conversation.
          $ref: "#/components/schemas/ConvId"
        options:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 40 }
        insist_s:
          description: |
            If the user hasn't written in the conversation this many seconds after it went out, the
            relay sends it again (prefixed ⏰); with `call`, after as long again it rings the phone.
          type: integer
          minimum: 60
          maximum: 21600
        call: { type: boolean }
    Agent:
      type: object
      required: [agent_id, name, created_at]
      properties:
        agent_id: { $ref: "#/components/schemas/AgentId" }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        online: { type: boolean }
        last_seen_at:
          description: When the agent last used its key (to the minute). Tells whether its routines run.
          $ref: "#/components/schemas/Timestamp"
        wakes:
          type: boolean
          description: "Hivepal: the relay emails the agent a wake-up call when the user writes to it (the address stays private)."
        mailbox:
          type: boolean
          description: "Hivepal: the relay writes the agent's messages as Markdown files (`PUT /v1/agents/{agent_id}/mailbox`)."
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [agent_id, name]
      properties:
        agent_id: { $ref: "#/components/schemas/AgentId" }
        name: { type: string, minLength: 1, maxLength: 64 }
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    CreatedAgent:
      type: object
      required: [agent, api_key]
      properties:
        agent: { $ref: "#/components/schemas/Agent" }
        api_key: { type: string, description: "`ak_…`; shown only here." }
    Group:
      type: object
      required: [group_id, name, members, created_at]
      properties:
        group_id: { $ref: "#/components/schemas/AgentId" }
        name: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/AgentId" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [group_id, name, members]
      properties:
        group_id: { $ref: "#/components/schemas/AgentId" }
        name: { type: string, minLength: 1, maxLength: 64 }
        members:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/AgentId" }
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        members:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/AgentId" }
    Party:
      description: A human-or-agent side of the conversation.
      type: string
      enum: [agent, user]
    Actor:
      type: string
      enum: [agent, user, relay]
    Priority:
      type: string
      enum: [normal, urgent]
    CallDirection:
      type: string
      enum: [agent_to_user, user_to_agent]
    CallState:
      type: string
      enum: [ringing, active, ended, missed, declined, canceled]
    EndReason:
      type: string
      enum: [hangup, canceled, room_closed, error, quota]

    Memory:
      type: object
      additionalProperties: false
      description: "Hivepal: how bots remember their Hivepal conversations."
      required: [markdown, sqlite]
      properties:
        markdown: { type: boolean, description: "Each day's conversation in the agent's mailbox (history/)." }
        sqlite: { type: boolean, description: "Searchable, and downloadable as a SQLite file." }

    DeliverySettings:
      type: object
      description: "Hivepal: how the relay reaches agents (issue #41). Secrets are never returned."
      required: [email, mailboxes, memory, mailbox_repo]
      properties:
        mailboxes:
          type: object
          required: [all_agents]
          properties:
            all_agents: { type: boolean, description: "Every agent has a mailbox unless turned off for it." }
        memory: { $ref: "#/components/schemas/Memory" }
        email:
          type: object
          required: [configured]
          properties:
            configured: { type: boolean }
            address: { type: string }
            server: { type: string, description: "host:port" }
            from_env: { type: boolean, description: "From HIVEPAL_SMTP_URL rather than saved in the relay." }
        mailbox_repo:
          type: object
          properties:
            url: { type: string }
            branch: { type: string }
            public_key: { type: string, description: "The relay's SSH deploy key: add it to the repository with write access." }
            last_push_at: { type: integer, format: int64 }
            last_error: { type: string }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [invalid_request, exists, unauthorized, invalid_pairing_token, forbidden, not_found, busy, no_devices, agent_offline, calls_unavailable, invalid_state, call_ended, rate_limited, quota_exceeded, tenant_disabled, email_failed, repo_failed, internal]
            message: { type: string }

    # ---------- system ----------
    Status:
      type: object
      required: [relay_id, version, agent_name, agent_online, push_provider]
      properties:
        relay_id: { $ref: "#/components/schemas/RelayId" }
        version: { type: string }
        agent_name: { type: string }
        agent_online: { type: boolean }
        push_provider: { type: string, examples: [fcm] }
        device_count:
          description: Only returned to the agent.
          type: integer
        features:
          description: >-
            Hivepal, only returned to an agent: what this relay is configured for. `calls`: LiveKit is
            set up. `voice`: Gemini is set up (voice notes, transcripts). `wake_email`: the relay has an email
            account (wake-up emails). `mailbox_repo`: an external mailbox repository is set. Push is `push_provider`.
          type: object
          required: [calls, voice, wake_email]
          properties:
            calls: { type: boolean }
            voice: { type: boolean }
            wake_email: { type: boolean }
            mailbox_repo: { type: boolean, description: "Hivepal: an external mailbox repository is set." }
        self:
          description: Only returned to an agent; the agent the key belongs to.
          type: object
          required: [agent_id, name]
          properties:
            agent_id: { $ref: "#/components/schemas/AgentId" }
            name: { type: string }
        active_call:
          description: The call currently ringing or active, if any.
          oneOf:
            - $ref: "#/components/schemas/Call"
            - type: "null"

    # ---------- pairing / devices ----------
    PairingToken:
      type: object
      required: [pairing_token, expires_at, qr_payload]
      properties:
        pairing_token:
          type: string
          pattern: "^pt_[A-Za-z0-9_-]{43}$"
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        qr_payload:
          description: Exact string to encode in the QR (compact JSON of `QrPayload`).
          type: string
        qr_url:
          description: >-
            Hivepal: the same pairing as a link, `<relay>/pair#<base64url of qr_payload>`. Its QR also works
            from the phone's camera: the relay's /pair page offers to open the app (or to install it first),
            which then asks before pairing. The code is in the fragment, which browsers never send.
            Hivepal apps accept either form when scanning or pasting.
          type: string
          format: uri
      example:
        pairing_token: pt_q8Vx0m3cJ5a1n1wYg7Kc9b2dE4fH6iL8oP0rS2tU4vW
        expires_at: 1761200600000
        qr_payload: '{"v":1,"relay_url":"https://relay.example.com","pairing_token":"pt_q8Vx0m3cJ5a1n1wYg7Kc9b2dE4fH6iL8oP0rS2tU4vW"}'
        qr_url: https://relay.example.com/pair#eyJ2IjoxLCJyZWxheV91cmwiOiJodHRwczovL3JlbGF5LmV4YW1wbGUuY29tIiwicGFpcmluZ190b2tlbiI6InB0X3E4VngwbTNjSjVhMW4xd1lnN0tjOWIyZEU0Zkg2aUw4b1AwclMydFU0dlcifQ
    QrPayload:
      type: object
      required: [v, relay_url, pairing_token]
      properties:
        v: { const: 1 }
        relay_url: { type: string, format: uri }
        pairing_token: { type: string }
    PairRequest:
      type: object
      additionalProperties: false
      required: [pairing_token, device_name, platform]
      properties:
        pairing_token: { type: string }
        fcm_token:
          description: May be omitted if not yet available; send later via /v1/device/fcm.
          type: string
          maxLength: 4096
        device_name: { type: string, minLength: 1, maxLength: 64 }
        platform: { type: string, enum: [android] }
        app_version: { type: string, maxLength: 32 }
    PairResponse:
      type: object
      required: [device_id, device_jwt, push_secret, relay_id, agent_name, push_config]
      properties:
        device_id: { $ref: "#/components/schemas/DeviceId" }
        device_jwt: { type: string }
        push_secret:
          description: base64url, 32 bytes. Key for HMAC-SHA256 over push `event` field.
          type: string
        relay_id: { $ref: "#/components/schemas/RelayId" }
        agent_name: { type: string }
        push_config: { $ref: "#/components/schemas/PushConfig" }
    PushConfig:
      description: |
        How the app should register for push. Lets one prebuilt APK work with
        any user's own Firebase project: the app initialises Firebase at
        runtime with these public client values instead of a compiled-in
        google-services.json. `null` when the relay has no push configured.
      oneOf:
        - type: "null"
        - type: object
          required: [provider, fcm]
          properties:
            provider: { const: fcm }
            fcm:
              type: object
              required: [project_id, application_id, api_key, sender_id]
              properties:
                project_id: { type: string }
                application_id: { type: string, description: "mobilesdk_app_id, e.g. 1:1234:android:abcd" }
                api_key: { type: string }
                sender_id: { type: string, description: "project_number" }
    Device:
      type: object
      required: [device_id, name, platform, created_at, has_push_token]
      properties:
        device_id: { $ref: "#/components/schemas/DeviceId" }
        name: { type: string }
        platform: { type: string, enum: [android] }
        app_version: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
        has_push_token: { type: boolean }
        push_via:
          description: "Hivepal: how the relay wakes this device: `unifiedpush`, `fcm`, or `none`."
          type: string
          enum: [unifiedpush, fcm, none]

    # ---------- calls ----------
    CreateCallRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          description: Required when the agent calls; optional when the user calls.
          type: string
          maxLength: 500
        priority:
          $ref: "#/components/schemas/Priority"
          default: normal
        agent_name:
          description: Display name override for this call (agent only).
          type: string
          maxLength: 64
        agent_id:
          description: |
            Device only: which agent to call (default `main`). The voice daemon (the `main` agent's
            WebSocket) answers every call; it takes on that agent's persona.
          $ref: "#/components/schemas/AgentId"
        device_ids:
          description: |
            Agent only: ring only these paired, non-revoked phones (a targeted
            call) instead of every paired phone. Only they get the invite, can
            answer, decline or join, and see the call at all. Duplicates are
            ignored. Unknown or revoked ids, an empty list, or a device caller
            sending it → `400 invalid_request`.
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/DeviceId" }
    Call:
      type: object
      required: [call_id, direction, state, priority, agent_name, created_at]
      properties:
        call_id: { $ref: "#/components/schemas/CallId" }
        direction: { $ref: "#/components/schemas/CallDirection" }
        state: { $ref: "#/components/schemas/CallState" }
        reason: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        agent_name: { type: string }
        agent_id:
          description: The agent that placed (or, for `user_to_agent`, takes) the call. Absent on calls from before the fork.
          $ref: "#/components/schemas/AgentId"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        answered_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at: { $ref: "#/components/schemas/Timestamp" }
        ended_by: { $ref: "#/components/schemas/Actor" }
        end_reason: { $ref: "#/components/schemas/EndReason" }
        duration_ms: { type: integer, minimum: 0 }
        time_left_ms:
          description: >-
            Only in `GET /v1/calls/{call_id}` for an active call on a relay that limits call time
            (a hosted plan): how much longer it can last before the relay ends it with
            `end_reason: quota`. A voice agent can warn the user before the cut.
          type: integer
          minimum: 0
        device_id:
          description: Device that placed or answered the call.
          $ref: "#/components/schemas/DeviceId"
        device_ids:
          description: Targeted call only; the phones it rings. Absent = every paired phone.
          type: array
          items: { $ref: "#/components/schemas/DeviceId" }
    JoinInfo:
      type: object
      required: [livekit_url, livekit_token, room, identity, expires_at]
      properties:
        livekit_url: { type: string, format: uri, examples: ["wss://relay.example.com"] }
        livekit_token:
          description: Access token valid for this room only; TTL 120 s (join window).
          type: string
        room: { type: string, examples: [call_01JB0000000000000000000000] }
        identity: { type: string, examples: [agent, device_dev_01JB0000000000000000000000] }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CallWithJoin:
      type: object
      required: [call, join]
      properties:
        call: { $ref: "#/components/schemas/Call" }
        join: { $ref: "#/components/schemas/JoinInfo" }

    # ---------- messages ----------
    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        reply_to:
          description: Optional msg_id or call_id this message responds to.
          type: string
        client_msg_id:
          description: Idempotency key chosen by the sender (unique per sender).
          type: string
          maxLength: 64
        conv:
          description: |
            Where to post. Default: the sender agent's own conversation; for the user, `agent:main`.
            An agent may post to its own conversation, to a group it belongs to, or to a `bots:`
            conversation it is part of (403 otherwise).
          $ref: "#/components/schemas/ConvId"
        options:
          description: Quick replies the app shows as buttons under the message (agent only). Tapping one sends it as a reply.
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 40 }
        attachments:
          description: Files from `POST /v1/files` (at most 4). With attachments, `text` may be empty.
          type: array
          maxItems: 4
          items: { type: string }
    Message:
      type: object
      required: [msg_id, from, text, created_at]
      properties:
        msg_id: { $ref: "#/components/schemas/MsgId" }
        from: { $ref: "#/components/schemas/Party" }
        text: { type: string }
        reply_to: { type: string }
        client_msg_id: { type: string }
        device_id:
          description: Sending device when `from` = user.
          $ref: "#/components/schemas/DeviceId"
        conv: { $ref: "#/components/schemas/ConvId" }
        agent_id:
          description: Sending agent when `from` = agent.
          $ref: "#/components/schemas/AgentId"
        options:
          type: array
          items: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        read_at: { $ref: "#/components/schemas/Timestamp" }

    # ---------- events ----------
    EventBase:
      type: object
      required: [type, id, ts]
      properties:
        type: { type: string }
        id: { $ref: "#/components/schemas/EventId" }
        ts: { $ref: "#/components/schemas/Timestamp" }
        seq:
          description: Position in the relay event log. Absent on ephemeral events.
          type: integer
          minimum: 1

    Event:
      oneOf:
        - $ref: "#/components/schemas/CallInviteEvent"
        - $ref: "#/components/schemas/CallRingingEvent"
        - $ref: "#/components/schemas/CallAcceptEvent"
        - $ref: "#/components/schemas/CallDeclineEvent"
        - $ref: "#/components/schemas/CallEndEvent"
        - $ref: "#/components/schemas/CallMissedEvent"
        - $ref: "#/components/schemas/MsgNewEvent"
        - $ref: "#/components/schemas/MsgReadEvent"
        - $ref: "#/components/schemas/AgentPresenceEvent"
        - $ref: "#/components/schemas/WsHelloEvent"
        - $ref: "#/components/schemas/AgentUpdatedEvent"
        - $ref: "#/components/schemas/GroupUpdatedEvent"
        - $ref: "#/components/schemas/MsgDeletedEvent"
        - $ref: "#/components/schemas/AgentTypingEvent"
      discriminator:
        propertyName: type
        mapping:
          call.invite: "#/components/schemas/CallInviteEvent"
          call.ringing: "#/components/schemas/CallRingingEvent"
          call.accept: "#/components/schemas/CallAcceptEvent"
          call.decline: "#/components/schemas/CallDeclineEvent"
          call.end: "#/components/schemas/CallEndEvent"
          call.missed: "#/components/schemas/CallMissedEvent"
          msg.new: "#/components/schemas/MsgNewEvent"
          msg.read: "#/components/schemas/MsgReadEvent"
          agent.presence: "#/components/schemas/AgentPresenceEvent"
          ws.hello: "#/components/schemas/WsHelloEvent"
          agent.updated: "#/components/schemas/AgentUpdatedEvent"
          group.updated: "#/components/schemas/GroupUpdatedEvent"
          msg.deleted: "#/components/schemas/MsgDeletedEvent"
          agent.typing: "#/components/schemas/AgentTypingEvent"

    CallInviteEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id, direction, agent_name, reason, priority, expires_at]
          properties:
            type: { const: call.invite }
            call_id: { $ref: "#/components/schemas/CallId" }
            direction: { $ref: "#/components/schemas/CallDirection" }
            agent_name: { type: string }
            agent_id: { $ref: "#/components/schemas/AgentId" }
            reason: { type: string, description: "Empty string if the user called without a reason." }
            priority: { $ref: "#/components/schemas/Priority" }
            expires_at:
              description: Do not ring after this instant (= created + ring timeout).
              $ref: "#/components/schemas/Timestamp"
            device_ids:
              description: |
                Targeted call only; the phones it rings. The relay never delivers the
                events of a targeted call to other phones, so clients need not filter.
              type: array
              items: { $ref: "#/components/schemas/DeviceId" }
      example:
        type: call.invite
        id: evt_01JB0000000000000000000001
        ts: 1761200000000
        seq: 41
        call_id: call_01JB0000000000000000000002
        direction: agent_to_user
        agent_name: Claude
        reason: Deploy to prod is ready, need your go/no-go
        priority: urgent
        expires_at: 1761200030000

    CallRingingEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id, device_id]
          properties:
            type: { const: call.ringing }
            call_id: { $ref: "#/components/schemas/CallId" }
            device_id: { $ref: "#/components/schemas/DeviceId" }

    CallAcceptEvent:
      description: |
        A callee answered. In a group call, emitted once per phone that joins
        (via `accept` or `join`). Pushed to the other phones at normal priority so
        they can offer "join the call".
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id, by]
          properties:
            type: { const: call.accept }
            call_id: { $ref: "#/components/schemas/CallId" }
            by: { $ref: "#/components/schemas/Party" }
            device_id: { $ref: "#/components/schemas/DeviceId" }

    CallDeclineEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id, by]
          properties:
            type: { const: call.decline }
            call_id: { $ref: "#/components/schemas/CallId" }
            by: { $ref: "#/components/schemas/Party" }
            device_id: { $ref: "#/components/schemas/DeviceId" }

    CallEndEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id, by, reason]
          properties:
            type: { const: call.end }
            call_id: { $ref: "#/components/schemas/CallId" }
            by: { $ref: "#/components/schemas/Actor" }
            reason: { $ref: "#/components/schemas/EndReason" }
            duration_ms: { type: integer, minimum: 0 }

    CallMissedEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, call_id]
          properties:
            type: { const: call.missed }
            call_id: { $ref: "#/components/schemas/CallId" }

    MsgNewEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, msg_id, from, text]
          properties:
            type: { const: msg.new }
            msg_id: { $ref: "#/components/schemas/MsgId" }
            from: { $ref: "#/components/schemas/Party" }
            text: { type: string }
            reply_to: { type: string }
            conv: { $ref: "#/components/schemas/ConvId" }
            agent_id:
              description: Sending agent when `from` = agent.
              $ref: "#/components/schemas/AgentId"
            options:
              type: array
              items: { type: string }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            truncated:
              description: Only in push payloads; fetch the full message via GET /v1/messages/{msg_id}.
              type: boolean
      example:
        type: msg.new
        id: evt_01JB0000000000000000000003
        ts: 1761200000000
        seq: 42
        msg_id: msg_01JB0000000000000000000004
        from: agent
        text: "Build finished ✅"

    MsgReadEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, msg_id, by]
          properties:
            type: { const: msg.read }
            msg_id: { $ref: "#/components/schemas/MsgId" }
            by: { $ref: "#/components/schemas/Party" }
            conv: { $ref: "#/components/schemas/ConvId" }

    AgentPresenceEvent:
      description: Ephemeral (no seq). Sent to devices when the daemon connects/disconnects.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, online]
          properties:
            type: { const: agent.presence }
            online: { type: boolean }
            agent_id:
              description: Which agent connected or disconnected (absent = `main`, older relays).
              $ref: "#/components/schemas/AgentId"

    AgentTypingEvent:
      description: >-
        Ephemeral (no seq). Hivepal: an agent started or stopped writing in a conversation. Sent to devices;
        a phone connecting gets the agents typing right now. `until` is when it ends by itself.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, agent_id, conv, typing]
          properties:
            type: { const: agent.typing }
            agent_id: { $ref: "#/components/schemas/AgentId" }
            conv: { $ref: "#/components/schemas/ConvId" }
            typing: { type: boolean }
            until: { $ref: "#/components/schemas/Timestamp" }

    WsHelloEvent:
      description: Ephemeral (no seq). First frame of every WebSocket.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, relay_id, last_seq, server_ts]
          properties:
            type: { const: ws.hello }
            relay_id: { $ref: "#/components/schemas/RelayId" }
            last_seq: { type: integer, minimum: 0 }
            server_ts: { $ref: "#/components/schemas/Timestamp" }

    AgentUpdatedEvent:
      description: An agent was added, renamed or removed.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, agent_id, name]
          properties:
            type: { const: agent.updated }
            agent_id: { $ref: "#/components/schemas/AgentId" }
            name: { type: string }
            removed: { type: boolean }

    GroupUpdatedEvent:
      description: A group was created, changed or removed.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, group_id, name, members]
          properties:
            type: { const: group.updated }
            group_id: { $ref: "#/components/schemas/AgentId" }
            name: { type: string }
            members:
              type: array
              items: { $ref: "#/components/schemas/AgentId" }
            removed: { type: boolean }

    MsgDeletedEvent:
      description: Its author deleted a message.
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [type, msg_id]
          properties:
            type: { const: msg.deleted }
            msg_id: { $ref: "#/components/schemas/MsgId" }
            conv: { $ref: "#/components/schemas/ConvId" }

    # ---------- push ----------
    PushData:
      description: |
        The FCM `data` map (all values are strings). `event` is the compact JSON
        of an `Event`; `sig` = base64url(HMAC-SHA256(push_secret, event)).
      type: object
      required: [v, relay_id, event, sig]
      properties:
        v: { const: "1" }
        relay_id: { $ref: "#/components/schemas/RelayId" }
        event: { type: string }
        sig: { type: string }
